home.kicker=Volunteering across Israel
home.title=Help is needed every week. Finding where shouldn't take an evening of WhatsApp groups.
home.lead=Food banks before the holidays, seniors who live alone, kids who need help with homework. Requests for volunteers are scattered across chats, posts and phone calls, and many people who want to help never see them. IsraeliHelp puts them in one place — by city, by date, with a clear number of hands needed.
