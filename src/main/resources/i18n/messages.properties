about.title=About IsraeliHelp
about.p1=IsraeliHelp is a school project (code 899373) for the course Introduction to Web Programming, 2026–2027.
about.p2=The site connects people who want to volunteer with community initiatives across Israel. Events and organizations shown here are examples for demonstration.
about.p3=Built with HTML, CSS, JavaScript, Java (Jakarta Servlets + JSP) and MySQL.

