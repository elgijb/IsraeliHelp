home.fromDate=From date
home.show=Show opportunities
home.browseAll=or browse all {0} open opportunities
home.problemTitle=Why helping is harder than it should be
home.problemLead=Organizations need volunteers. People want to help. The gap between them is mostly about information.
home.p1.title=Requests are scattered
home.p1.body=A call for help lives in one WhatsApp group, a Facebook post or a notice at the community center. If you're not in the right group, you never hear about it.
home.p1.fix=All opportunities in one catalog, searchable by city, category and date.
home.p2.title=It's unclear what's actually needed
home.p2.body="We need help on Friday" — where exactly, at what time, and are they still looking for people or already full?
home.p2.fix=Every event shows the address, date and time, and how many volunteers are still needed.
home.p3.title=No answer after you offer help
home.p3.body=You send a message and wait. Did anyone see it? Are you expected to come?
home.p3.fix=Your applications and their status — pending, approved or rejected — are in your account.
