about.title=О IsraeliHelp
about.p1=IsraeliHelp — школьный проект (код 899373) по предмету Introduction to Web Programming, 2026–2027.
about.p2=Сайт соединяет людей, которые хотят помогать, с общественными инициативами в Израиле. Показанные мероприятия и организации — учебные примеры.
about.p3=Сделано на HTML, CSS, JavaScript, Java (Jakarta Servlets + JSP) и MySQL.

