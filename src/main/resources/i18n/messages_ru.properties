home.kicker=Волонтёрство по всему Израилю
home.title=Помощь нужна каждую неделю. Искать её не должно занимать вечер в WhatsApp-группах.
home.lead=Продуктовые наборы перед праздниками, пожилые люди, живущие одни, дети, которым нужна помощь с уроками. Просьбы о волонтёрах разбросаны по чатам, постам и звонкам — и многие, кто хочет помочь, о них не узнают. IsraeliHelp собирает их в одном месте: по городу, по дате, с понятным числом нужных рук.
home.findTitle=Найти мероприятие
home.city=Город
