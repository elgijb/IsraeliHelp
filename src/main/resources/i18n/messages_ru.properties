home.fromDate=С даты
home.show=Показать
home.browseAll=или открыть все {0} доступных мероприятий
home.problemTitle=Почему помогать сложнее, чем должно быть
home.problemLead=Организациям нужны волонтёры. Люди хотят помогать. Между ними — в основном проблема информации.
home.p1.title=Просьбы разбросаны
home.p1.body=Призыв о помощи живёт в одной WhatsApp-группе, посте в Facebook или объявлении в центре. Если вы не в нужной группе — вы о нём не узнаете.
home.p1.fix=Все мероприятия в одном каталоге, поиск по городу, категории и дате.
home.p2.title=Непонятно, что именно нужно
home.p2.body=«Нужна помощь в пятницу» — где именно, во сколько, и люди ещё нужны или уже набраны?
home.p2.fix=У каждого мероприятия — адрес, дата и время и сколько волонтёров ещё нужно.
home.p3.title=Нет ответа после предложения помощи
home.p3.body=Вы пишете сообщение и ждёте. Увидели ли его? Ожидают ли вас?
home.p3.fix=Ваши заявки и их статус — на рассмотрении, одобрена или отклонена — в личном кабинете.
