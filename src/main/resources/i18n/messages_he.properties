home.p2.title=לא ברור מה באמת צריך
home.p2.body="צריך עזרה ביום שישי" — איפה בדיוק, באיזו שעה, ועדיין מחפשים אנשים או שכבר מלא?
home.p2.fix=בכל אירוע מופיעים הכתובת, התאריך והשעה, וכמה מתנדבים עדיין חסרים.
