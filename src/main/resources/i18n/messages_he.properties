home.p1.title=הבקשות מפוזרות
home.p1.body=קריאה לעזרה חיה בקבוצת וואטסאפ אחת, בפוסט בפייסבוק או במודעה במרכז קהילתי. אם אתם לא בקבוצה הנכונה — לא תדעו עליה.
