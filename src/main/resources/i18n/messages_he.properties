home.kicker=התנדבות ברחבי ישראל
home.title=תמיד צריך עזרה. למצוא איפה לא אמור לקחת ערב שלם בקבוצות וואטסאפ.
home.lead=חלוקת מזון לפני החגים, קשישים שגרים לבד, ילדים שצריכים עזרה בשיעורים. בקשות למתנדבים מפוזרות בצ'אטים, בפוסטים ובשיחות טלפון — ורבים שרוצים לעזור פשוט לא רואים אותן. IsraeliHelp מרכז אותן במקום אחד: לפי עיר, לפי תאריך, עם מספר ברור של ידיים נדרשות.
